name: Windows release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out tagged source and dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Build Qt and NoGUI executables
        run: >-
          msbuild Source/dolphin-emu.sln
          /m:2 /nologo /verbosity:minimal
          '/t:Dolphin;DolphinNoGUI'
          /p:Configuration=Release /p:Platform=x64
          /p:AutoUpdate=false

      - name: Package Windows executables and runtime resources
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'Binary/x64'

          # Include the app-local MSVC runtime so a clean Windows machine can run the ZIP.
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Visual Studio installation not found' }
          $redist = Get-ChildItem "$vs/VC/Redist/MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (!$redist) { throw 'MSVC redistributable directory not found' }
          $crt = Join-Path $redist.FullName 'x64/Microsoft.VC143.CRT'
          Copy-Item "$crt/*.dll" $output

          # MSBuild deploys Qt DLLs/plugins, translations, Sys, and license files here.
          foreach ($path in @(
            'Dolphin.exe', 'DolphinNoGUI.exe', 'Sys', 'Languages', 'COPYING', 'LICENSES',
            'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'Qt6Svg.dll', 'qt.conf',
            'QtPlugins/platforms/qwindows.dll', 'vcruntime140.dll', 'msvcp140.dll'
          )) {
            if (!(Test-Path (Join-Path $output $path))) {
              throw "Missing release file: $path"
            }
          }

          # Catch missing runtime DLLs or an unusable executable before publishing.
          & "$output/DolphinNoGUI.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'DolphinNoGUI startup check failed' }

          New-Item -ItemType Directory -Path release | Out-Null
          $archive = Join-Path $env:GITHUB_WORKSPACE 'release/dolphin-dap-windows-x64.zip'
          Compress-Archive -Path "$output/*" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  dolphin-dap-windows-x64.zip" |
            Set-Content 'release/dolphin-dap-windows-x64.zip.sha256' -Encoding ascii

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release

      - name: Create release if needed and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
